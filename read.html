<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#191548" />
    <title>朗读调试 · 病毒大扫除</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #191548;
        --panel: #241c5f;
        --ink: #f4f1ff;
        --muted: #b8b0e8;
        --accent: #7660de;
        --accent-deep: #4e3aa8;
        --good: #54d99a;
        --bad: #ff7f9f;
        --warn: #ffd76a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 24px 18px 48px;
        background:
          radial-gradient(1200px 500px at 50% -10%, rgb(118 96 222 / 35%), transparent),
          var(--bg);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      }

      main {
        width: min(100%, 560px);
        margin: 0 auto;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
      }

      .hint {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.6;
      }

      .panel {
        margin-bottom: 16px;
        padding: 16px;
        border: 1px solid rgb(255 255 255 / 10%);
        border-radius: 16px;
        background: var(--panel);
      }

      .panel h2 {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 800;
        letter-spacing: 0.08em;
      }

      .characters {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .character-button {
        width: 64px;
        aspect-ratio: 1;
        border: 2px solid transparent;
        border-radius: 14px;
        color: var(--ink);
        font: inherit;
        font-size: 30px;
        background: #332a76;
        cursor: pointer;
      }

      .character-button.is-selected {
        border-color: var(--accent);
        background: var(--accent-deep);
        box-shadow: 0 0 0 3px rgb(118 96 222 / 30%);
      }

      .target-info {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
      }

      .target-info strong {
        color: var(--ink);
        font-size: 20px;
      }

      .status {
        margin: 0;
        min-height: 24px;
        font-size: 16px;
        font-weight: 800;
      }

      .status[data-kind="listening"] {
        color: var(--warn);
      }

      .status[data-kind="success"] {
        color: var(--good);
      }

      .status[data-kind="incorrect"],
      .status[data-kind="error"] {
        color: var(--bad);
      }

      .progress {
        margin-top: 12px;
        height: 8px;
        overflow: hidden;
        border-radius: 999px;
        background: #332a76;
      }

      .progress.is-hidden {
        display: none;
      }

      .progress-fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, var(--accent), #9c8cff);
        transition: width 120ms linear;
      }

      .progress-label {
        display: block;
        margin-top: 8px;
        color: var(--muted);
        font-size: 12px;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        margin-bottom: 16px;
      }

      .record-button {
        min-width: 132px;
        border: 0;
        border-radius: 999px;
        padding: 14px 22px;
        color: #fff;
        font: inherit;
        font-size: 16px;
        font-weight: 800;
        background: linear-gradient(180deg, var(--accent), var(--accent-deep));
        box-shadow: 0 6px 0 #352678, 0 12px 22px rgb(57 41 120 / 35%);
        cursor: pointer;
      }

      .record-button:active {
        transform: translateY(3px);
        box-shadow: 0 3px 0 #352678;
      }

      .record-button:disabled {
        cursor: wait;
        filter: grayscale(0.45);
        opacity: 0.7;
      }

      .secondary-button {
        border: 1px solid rgb(255 255 255 / 18%);
        border-radius: 999px;
        padding: 12px 18px;
        color: var(--ink);
        font: inherit;
        font-size: 14px;
        background: #332a76;
        cursor: pointer;
      }

      .text-button {
        border: 0;
        padding: 12px 4px;
        color: var(--muted);
        font: inherit;
        font-size: 14px;
        background: none;
        cursor: pointer;
      }

      .log {
        display: grid;
        gap: 8px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .log li {
        padding: 10px 12px;
        border-left: 4px solid var(--muted);
        border-radius: 10px;
        background: rgb(255 255 255 / 5%);
      }

      .log li.is-accepted {
        border-left-color: var(--good);
      }

      .log li.is-rejected {
        border-left-color: var(--bad);
      }

      .log strong {
        font-size: 22px;
      }

      .log small {
        display: block;
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.5;
      }

      .log-empty {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>🎙️ 朗读调试</h1>
      <p class="hint">
        选择目标字，播放提示音后点“开始录音”说出这个字。页面会实时显示会话状态、
        模型加载进度和识别器的原始输出，方便定位朗读任务的问题。
      </p>

      <section class="panel" aria-label="目标字">
        <h2>目标字</h2>
        <div id="characters" class="characters"></div>
        <p id="target-info" class="target-info"></p>
      </section>

      <section class="panel" aria-label="会话状态">
        <h2>会话状态</h2>
        <p id="status" class="status" aria-live="polite">空闲</p>
        <div id="progress" class="progress is-hidden" aria-hidden="true">
          <div id="progress-fill" class="progress-fill"></div>
        </div>
        <span id="progress-label" class="progress-label"></span>
      </section>

      <div class="actions">
        <button id="record" class="record-button" type="button">
          🎙️ 开始录音
        </button>
        <button id="instruction" class="secondary-button" type="button">
          🔊 播放提示音
        </button>
        <button id="clear" class="text-button" type="button">清空日志</button>
      </div>

      <section class="panel" aria-label="原始识别结果">
        <h2>原始识别结果</h2>
        <ol id="log" class="log"></ol>
      </section>
    </main>
    <script type="module" src="/src/read-debug.ts"></script>
  </body>
</html>
